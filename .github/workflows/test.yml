name: test

on:
  push:
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache: false
      - name: Validate and publish commit statuses
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          post_status() {
            context="$1"
            state="$2"
            description="$3"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/statuses/$SHA" \
              -d "{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"$description\"}" >/dev/null || true
          }

          fail_with_output() {
            stage="$1"
            output="$2"
            line="$(printf '%s\n' "$output" | grep -m1 -E '\.go:[0-9]+:[0-9]+:' || true)"
            if [ -z "$line" ]; then
              line="$(printf '%s\n' "$output" | tail -n 1)"
            fi
            slug="$(printf '%s' "$line" | head -c 150 | tr ' /:' '___' | tr -cd 'A-Za-z0-9_.=-')"
            [ -n "$slug" ] || slug=unknown
            post_status "mygpt-cf-tunnel/$stage/$slug" failure "$stage failed"
            post_status "mygpt-cf-tunnel/tests" failure "$stage failed"
            printf '%s\n' "$output"
            exit 1
          }

          format_output="$(gofmt -l .)"
          if [ -n "$format_output" ]; then
            fail_with_output gofmt "$format_output"
          fi
          post_status "mygpt-cf-tunnel/gofmt" success "gofmt check passed"

          compile_output="$(go test ./... -run '^$' 2>&1)" || fail_with_output compile "$compile_output"
          post_status "mygpt-cf-tunnel/compile" success "Go packages compile"

          test_output="$(go test ./... 2>&1)" || fail_with_output go-test "$test_output"
          post_status "mygpt-cf-tunnel/go-test" success "go test passed"

          vet_output="$(go vet ./... 2>&1)" || fail_with_output go-vet "$vet_output"
          post_status "mygpt-cf-tunnel/go-vet" success "go vet passed"

          arm_output="$(CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/mygpt-github-agent-linux-arm64 ./cmd/mygpt-github-agent 2>&1)" \
            || fail_with_output arm64-build "$arm_output"
          post_status "mygpt-cf-tunnel/arm64-build" success "linux/arm64 build passed"
          post_status "mygpt-cf-tunnel/tests" success "all validations passed"
