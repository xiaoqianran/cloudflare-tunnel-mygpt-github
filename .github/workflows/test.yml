name: test

on:
  push:
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Test, vet, and publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          state=success
          publish_status() {
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/statuses/$SHA" \
              -d "{\"state\":\"$state\",\"context\":\"cloudflare-tunnel-mygpt-github/tests\",\"description\":\"Go test and vet\"}" >/dev/null || true
          }
          trap publish_status EXIT
          gofmt -w .
          go test ./... || { state=failure; exit 1; }
          go vet ./... || { state=failure; exit 1; }
