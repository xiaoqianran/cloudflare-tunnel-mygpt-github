name: test

on:
  push:
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Validate and publish commit statuses
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          post_status() {
            context="$1"
            state="$2"
            description="$3"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/statuses/$SHA" \
              -d "{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"$description\"}" >/dev/null || true
          }

          fail_stage() {
            stage="$1"
            description="$2"
            post_status "cloudflare-tunnel-mygpt-github/$stage" failure "$description"
            post_status "cloudflare-tunnel-mygpt-github/tests" failure "$description"
            exit 1
          }

          gofmt -w .
          git diff --exit-code || fail_stage gofmt "gofmt changed tracked files"
          post_status "cloudflare-tunnel-mygpt-github/gofmt" success "gofmt clean"

          go test ./... || fail_stage go-test "go test failed"
          post_status "cloudflare-tunnel-mygpt-github/go-test" success "go test passed"

          go vet ./... || fail_stage go-vet "go vet failed"
          post_status "cloudflare-tunnel-mygpt-github/go-vet" success "go vet passed"

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/mygpt-github-agent-linux-arm64 ./cmd/mygpt-github-agent \
            || fail_stage arm64-build "linux/arm64 build failed"
          post_status "cloudflare-tunnel-mygpt-github/arm64-build" success "linux/arm64 build passed"
          post_status "cloudflare-tunnel-mygpt-github/tests" success "all validations passed"
